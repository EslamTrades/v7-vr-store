html,body{height:100%}
body{margin:0;background:var(--room);color:var(--ink);font:400 15px/1.45 var(--f);overflow:hidden}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;background:var(--room)}
#view:focus-visible{box-shadow:inset 0 0 0 3px var(--green)}
.top{position:fixed;inset:0 0 auto;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;padding-block:calc(10px + env(safe-area-inset-top,0px)) 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.top>*{pointer-events:auto;min-width:0}
.name{background:var(--paper);border-radius:6px;padding:6px 12px;font-size:13px;color:var(--mute)}
.name b{color:var(--green);font-weight:900;font-size:15px;margin-right:8px}
.act{display:flex;flex-wrap:wrap;gap:8px}
button,.go{font:700 14px var(--f);border:0;border-radius:6px;padding:10px 14px;background:var(--paper);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-block}
button.p,.go{background:var(--green);color:var(--paper)}
button:hover,.go:hover{box-shadow:0 0 0 2px var(--green)}
button:focus-visible,.go:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.low{position:fixed;inset:auto 0 0;display:grid;justify-items:center;gap:8px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;text-align:center}
#hint,#sub{background:var(--paper);border-radius:6px;padding:8px 14px;max-width:60ch}
#sub{background:var(--ink);color:var(--paper);font-weight:700}
#load{position:fixed;inset:0;display:grid;place-items:center;background:var(--room);color:var(--green);font:900 clamp(20px,4vw,32px) var(--f);text-align:center;padding:24px}
#load .off{max-width:34ch}#load p{margin:14px 0 0;font:400 17px/1.5 var(--f);color:var(--ink)}
#stats{position:fixed;left:16px;bottom:16px;background:var(--ink);color:var(--paper);padding:4px 8px;font:12px monospace}
#buy{position:fixed;inset:0;display:grid;place-items:center;background:rgba(16,28,20,.5);padding:16px}
#buy>div{background:var(--paper);border-radius:8px;padding:24px;max-width:380px;display:grid;gap:14px}
#buy h2{margin:0;font-size:22px;color:var(--green)}#buy p{margin:0}
#buy code{font-size:13px;overflow-wrap:anywhere}
.row{display:flex;gap:8px;flex-wrap:wrap}
body.vr .top,body.vr .low{display:none}
